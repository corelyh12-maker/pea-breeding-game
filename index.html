<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 완두콩 유전 교배 게임</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:linear-gradient(135deg,#edf9ee,#e4f4ff);
  color:#18351d;
}

header{
  background:linear-gradient(135deg,#238b45,#42b866);
  color:white;
  padding:28px 15px;
  text-align:center;
  box-shadow:0 4px 15px #0003;
}

header h1{
  margin:0 0 8px;
  font-size:30px;
}

header p{
  margin:0;
  opacity:.95;
}

main{
  max-width:1150px;
  margin:auto;
  padding:15px;
}

.panel{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:17px;
  box-shadow:0 5px 18px #0002;
}

.panel h2{
  margin-top:0;
}

/* 통계 */
.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.stat{
  background:#f1faf2;
  border-radius:13px;
  padding:12px;
  text-align:center;
  border:1px solid #dcefe0;
}

.stat b{
  display:block;
  font-size:23px;
  margin-top:5px;
}

/* 부모 */
.parents{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:12px 0;
}

.parent-slot{
  min-height:75px;
  border:2px dashed #b9d9bf;
  border-radius:13px;
  padding:12px;
  background:#f8fff9;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.parent-slot.active{
  border:3px solid #39a956;
  background:#eaffee;
}

.parent-number{
  font-size:13px;
  color:#51805b;
  font-weight:bold;
}

.parent-name{
  font-weight:bold;
  margin-top:5px;
}

/* 버튼 */
button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
  margin:3px;
  transition:.15s;
}

button:hover{
  transform:translateY(-1px);
  filter:brightness(1.04);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

#breed{
  background:#349d4e;
  color:white;
  font-size:16px;
}

#auto{
  background:#ffb52e;
}

#reset{
  background:#e85b5b;
  color:white;
}

/* 최근 탄생 */
.born-box{
  border:3px solid #8bd39a;
  border-radius:18px;
  padding:18px;
  background:linear-gradient(135deg,#f8fff9,#edfff1);
  display:none;
}

.born-box.show{
  display:block;
  animation:bornAppear .35s ease;
}

@keyframes bornAppear{
  from{transform:scale(.96);opacity:0}
  to{transform:scale(1);opacity:1}
}

.born-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.born-name{
  font-size:24px;
  font-weight:900;
  margin-bottom:8px;
}

.born-genotype{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0;
}

.born-info{
  font-size:16px;
  line-height:1.7;
}

.born-traits{
  margin-top:10px;
  padding:10px;
  background:white;
  border-radius:10px;
}

/* 컬렉션 */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:14px;
}

.card{
  border:2px solid #dfeae1;
  border-radius:16px;
  padding:15px;
  background:white;
  position:relative;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 15px #0002;
}

/* 선택된 카드 */
.card.selected{
  border:4px solid #24a849;
  background:linear-gradient(135deg,#ecfff0,#fafffb);
  box-shadow:
    0 0 0 4px #8be49d88,
    0 7px 22px #299b4738;
  transform:translateY(-3px);
}

.selected-badge{
  position:absolute;
  top:10px;
  right:10px;
  background:#24a849;
  color:white;
  padding:6px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  box-shadow:0 2px 6px #0003;
}

.card.locked{
  opacity:.65;
  filter:grayscale(.25);
}

/* 이름 */
.name{
  font-weight:900;
  font-size:18px;
  padding-right:90px;
}

/* 희귀도 */
.rarity{
  display:inline-block;
  margin:7px 0 10px;
  padding:5px 9px;
  border-radius:20px;
  font-size:13px;
  font-weight:900;
}

.rarity-common{
  background:#e8f3e9;
  color:#48704f;
}

.rarity-rare{
  background:#e6f0ff;
  color:#2764ad;
}

.rarity-super{
  background:#f1e7ff;
  color:#7041a8;
}

.rarity-special{
  background:#fff0bd;
  color:#a66a00;
}

.rarity-legend{
  background:linear-gradient(90deg,#ffe88a,#fff7c8,#ffd75e);
  color:#8a5900;
  box-shadow:0 0 12px #ffd83d99;
}

/* 유전자 */
.genes{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin:8px 0;
}

.gene{
  background:#eef5ef;
  padding:8px 5px;
  border-radius:8px;
  text-align:center;
  font-weight:900;
  border:1px solid #dbe7dc;
}

/* 열성 유전자 강조 */
.gene.recessive{
  background:linear-gradient(135deg,#ffe8fa,#f4d7ff);
  color:#8a237b;
  border:2px solid #d66ac4;
  box-shadow:0 0 8px #d66ac444;
  font-size:15px;
}

.recessive-label{
  color:#a1268f;
  font-weight:900;
}

.phen{
  font-size:13px;
  line-height:1.55;
  margin:10px 0;
  background:#f7faf7;
  padding:9px;
  border-radius:9px;
}

.recessive-count{
  font-weight:900;
  margin:7px 0;
}

/* 완전 열성 */
.card.perfect{
  border-color:#e1b52b;
  background:linear-gradient(135deg,#fffbea,#fff);
  box-shadow:0 0 18px #e5bd3d55;
}

/* 6 열성 */
.card.six{
  border-color:#b078df;
  background:linear-gradient(135deg,#fbf5ff,#fff);
}

/* 도감 */
.codex-row{
  padding:9px;
  border-bottom:1px solid #e5eee6;
  font-family:monospace;
}

/* 기록 */
.log{
  background:#17231a;
  color:#d8f7dd;
  border-radius:10px;
  padding:10px;
  max-height:200px;
  overflow:auto;
  font-family:monospace;
  font-size:13px;
}

/* 축하 */
.celebrate{
  position:fixed;
  inset:0;
  background:#000a;
  display:none;
  place-items:center;
  z-index:20;
  overflow:hidden;
}

.celebrate.show{
  display:grid;
}

.celebrate-box{
  background:white;
  padding:30px;
  border-radius:22px;
  text-align:center;
  max-width:470px;
  width:calc(100% - 35px);
  position:relative;
  z-index:30;
  box-shadow:0 10px 40px #0006;
  animation:pop .4s ease;
}

@keyframes pop{
  0%{transform:scale(.5);opacity:0}
  70%{transform:scale(1.05)}
  100%{transform:scale(1);opacity:1}
}

.celebrate-box h2{
  font-size:29px;
  margin-top:0;
}

.celebrate-box button{
  background:#2f8f46;
  color:white;
}

/* 폭죽 캔버스 */
#fireworks{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:25;
}

/* 모바일 */
@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .stats .stat:last-child{
    grid-column:span 2;
  }

  .parents{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🌱 완두콩 유전 교배 게임</h1>
  <p>멘델의 7가지 형질을 교배해서 희귀한 완두콩을 만들어보세요!</p>
</header>

<main>

<!-- 통계 -->
<div class="panel">
  <div class="stats">
    <div class="stat">
      보유 완두콩
      <b id="owned">0</b>
    </div>

    <div class="stat">
      총 교배
      <b id="total">0</b>
    </div>

    <div class="stat">
      다음 교배
      <b id="cooldown">가능</b>
    </div>

    <div class="stat">
      7개 완전 열성
      <b id="perfect">0</b>
    </div>

    <div class="stat">
      6개 열성
      <b id="six">0</b>
    </div>
  </div>
</div>


<!-- 교배 -->
<div class="panel">

  <h2>🧬 교배하기</h2>

  <div id="parents" class="parents">

    <div class="parent-slot">
      <div class="parent-number">1번 부모</div>
      <div class="parent-name">선택되지 않음</div>
    </div>

    <div class="parent-slot">
      <div class="parent-number">2번 부모</div>
      <div class="parent-name">선택되지 않음</div>
    </div>

  </div>

  <button id="breed">🌱 교배하기</button>
  <button id="auto">▶️ 자동 교배</button>
  <button id="reset">🔄 게임 초기화</button>

  <p>
    ※ 테스트를 위해 교배 쿨타임은 <b>0.05초</b>입니다.
  </p>

</div>


<!-- 최근 탄생 -->
<div class="panel">

  <div id="bornBox" class="born-box">

    <div class="born-title">
      🎉 최근 탄생한 완두콩
    </div>

    <div id="bornName" class="born-name"></div>

    <div id="bornRarity"></div>

    <div id="bornGenotype" class="born-genotype"></div>

    <div id="bornInfo" class="born-info"></div>

    <div id="bornTraits" class="born-traits"></div>

  </div>

</div>


<!-- 도감 -->
<div class="panel">

  <h2>📚 유전자 도감</h2>

  <p>
    처음 얻은 유전자 조합은 자동으로 도감에 등록됩니다.
  </p>

  <div id="codex"></div>

</div>


<!-- 완두콩 -->
<div class="panel">

  <h2>🌿 내 완두콩</h2>

  <p>
    💡 부모로 선택하려면 <b>부모 선택</b>을 누르세요.
    선택된 완두콩은 초록색 테두리로 크게 강조됩니다.
  </p>

  <div id="collection" class="grid"></div>

</div>


<!-- 기록 -->
<div class="panel">

  <h2>📜 기록</h2>

  <div id="log" class="log"></div>

</div>

</main>


<!-- 축하창 -->
<div id="celebrate" class="celebrate">

  <canvas id="fireworks"></canvas>

  <div class="celebrate-box">

    <h2 id="celebrateTitle"></h2>

    <p id="celebrateText"></p>

    <div id="celebrateGenes"></div>

    <button onclick="closeCelebrate()">확인</button>

  </div>

</div>


<script>

const loci=[

  {
    key:"R",
    dom:"둥근 씨앗",
    rec:"주름진 씨앗"
  },

  {
    key:"Y",
    dom:"노란 씨앗",
    rec:"초록 씨앗"
  },

  {
    key:"P",
    dom:"보라색 꽃",
    rec:"흰색 꽃"
  },

  {
    key:"I",
    dom:"부푼 꼬투리",
    rec:"잘록한 꼬투리"
  },

  {
    key:"G",
    dom:"초록 꼬투리",
    rec:"노란 꼬투리"
  },

  {
    key:"A",
    dom:"겨드랑이 꽃",
    rec:"끝 꽃"
  },

  {
    key:"T",
    dom:"키 큰 줄기",
    rec:"짧은 줄기"
  }

];


const starter=[
  "Rr",
  "Yy",
  "Pp",
  "Ii",
  "Gg",
  "Aa",
  "Tt"
];


let idSeq=2;

let peas=[
  makePea("🌱 시작 완두콩 A",starter),
  makePea("🌱 시작 완두콩 B",starter)
];

let selected=[];

let total=0;

let perfect=0;

let sixCount=0;

let codex=new Set();

let auto=false;

let cooldownUntil=0;

let lastBorn=null;


/* 완두콩 생성 */

function makePea(name,genes){

  return{
    id:++idSeq,
    name:name,
    genes:[...genes],
    fav:false,
    locked:false
  };

}


/* 유전자 키 */

function keyOf(pea){

  return pea.genes.join(" / ");

}


/* 열성 개수 */

function recessiveCount(genes){

  return genes.filter(g=>
    g[0]===g[1] &&
    g[0]===g[0].toLowerCase()
  ).length;

}


/* 표현형 */

function phenotype(genes){

  return genes.map((g,i)=>{

    const recessive=
      g[0]===g[1] &&
      g[0]===g[0].toLowerCase();

    return recessive
      ? loci[i].rec
      : loci[i].dom;

  });

}


/* 희귀도 */

function rarity(genes){

  const n=recessiveCount(genes);

  if(n===7) return {
    text:"🌟🌟🌟 전설",
    cls:"rarity-legend"
  };

  if(n===6) return {
    text:"🌟🌟 특별",
    cls:"rarity-special"
  };

  if(n>=4) return {
    text:"💎 초희귀",
    cls:"rarity-super"
  };

  if(n>=2) return {
    text:"✨ 희귀",
    cls:"rarity-rare"
  };

  return {
    text:"🌱 일반",
    cls:"rarity-common"
  };

}


/* 기록 */

function addLog(text){

  const log=document.getElementById("log");

  const div=document.createElement("div");

  div.textContent="• "+text;

  log.prepend(div);

}


/* 도감 등록 */

function register(pea){

  const key=keyOf(pea);

  if(!codex.has(key)){

    codex.add(key);

    addLog("📖 새로운 유전자 조합 발견!");

  }

}


peas.forEach(register);


/* 화면 전체 */

function render(){

  document.getElementById("owned").textContent=peas.length;

  document.getElementById("total").textContent=total;

  document.getElementById("perfect").textContent=perfect;

  document.getElementById("six").textContent=sixCount;

  updateCooldown();

  renderParents();

  renderCodex();

  renderCollection();

}


/* 부모 표시 */

function renderParents(){

  const el=document.getElementById("parents");

  el.innerHTML="";

  for(let i=0;i<2;i++){

    const slot=document.createElement("div");

    slot.className="parent-slot";

    if(selected[i]){

      const pea=peas.find(p=>p.id===selected[i]);

      if(pea){

        slot.classList.add("active");

        slot.innerHTML=`

          <div class="parent-number">
            ${i+1}번 부모 ✓ 선택됨
          </div>

          <div class="parent-name">
            ${pea.name}
          </div>

          <div>
            ${pea.genes.join(" ")}
          </div>

        `;

      }

    }else{

      slot.innerHTML=`

        <div class="parent-number">
          ${i+1}번 부모
        </div>

        <div class="parent-name">
          선택되지 않음
        </div>

      `;

    }

    el.appendChild(slot);

  }

}


/* 도감 */

function renderCodex(){

  const el=document.getElementById("codex");

  el.innerHTML="";

  [...codex].forEach((key,index)=>{

    const div=document.createElement("div");

    div.className="codex-row";

    div.textContent=
      "#"+(index+1)+"  "+key;

    el.appendChild(div);

  });

}


/* 완두콩 목록 */

function renderCollection(){

  const el=document.getElementById("collection");

  el.innerHTML="";

  peas.slice().reverse().forEach(pea=>{

    const count=
      recessiveCount(pea.genes);

    const rare=
      rarity(pea.genes);

    const card=
      document.createElement("div");

    card.className="card";

    if(selected.includes(pea.id))
      card.classList.add("selected");

    if(pea.locked)
      card.classList.add("locked");

    if(count===7)
      card.classList.add("perfect");

    else if(count===6)
      card.classList.add("six");


    /* 선택 배지 */

    if(selected.includes(pea.id)){

      const badge=
        document.createElement("div");

      badge.className="selected-badge";

      badge.textContent=
        selected[0]===pea.id
        ? "✓ 1번 부모"
        : "✓ 2번 부모";

      card.appendChild(badge);

    }


    /* 이름 */

    const name=
      document.createElement("div");

    name.className="name";

    name.textContent=
      pea.name+
      (pea.fav?" ⭐":"")+
      (pea.locked?" 🔒":"");

    card.appendChild(name);


    /* 희귀도 */

    const rarityDiv=
      document.createElement("div");

    rarityDiv.className=
      "rarity "+rare.cls;

    rarityDiv.textContent=
      rare.text;

    card.appendChild(rarityDiv);


    /* 유전자 */

    const genes=
      document.createElement("div");

    genes.className="genes";


    pea.genes.forEach(g=>{

      const span=
        document.createElement("span");

      span.className="gene";

      const isRecessive=
        g[0]===g[1] &&
        g[0]===g[0].toLowerCase();

      if(isRecessive){

        span.classList.add("recessive");

        span.textContent=
          "◆ "+g;

      }else{

        span.textContent=g;

      }

      genes.appendChild(span);

    });

    card.appendChild(genes);


    /* 열성 개수 */

    const recessiveText=
      document.createElement("div");

    recessiveText.className=
      "recessive-count";

    recessiveText.innerHTML=
      count===7
      ? "🔥 <span class='recessive-label'>7/7 완전 열성!</span>"
      : "🧬 열성 형질: "+count+"/7";

    card.appendChild(recessiveText);


    /* 표현형 */

    const phen=
      document.createElement("div");

    phen.className="phen";

    phenotype(pea.genes).forEach((x,i)=>{

      const line=
        document.createElement("div");

      const isRec=
        pea.genes[i][0]===
        pea.genes[i][1] &&
        pea.genes[i][0]===
        pea.genes[i][0].toLowerCase();

      line.innerHTML=
        "<b>"+loci[i].key+
        ":</b> "+
        (isRec
          ? "<span class='recessive-label'>"+x+"</span>"
          : x);

      phen.appendChild(line);

    });

    card.appendChild(phen);


    /* 버튼 */

    const selectBtn=
      document.createElement("button");

    selectBtn.className="select";

    selectBtn.textContent=
      selected.includes(pea.id)
      ? "✓ 부모 선택 해제"
      : "🧬 부모 선택";

    selectBtn.onclick=()=>{
      toggleSelect(pea.id);
    };


    const favBtn=
      document.createElement("button");

    favBtn.className="fav";

    favBtn.textContent=
      pea.fav
      ? "⭐ 즐겨찾기 해제"
      : "⭐ 즐겨찾기";

    favBtn.onclick=()=>{

      pea.fav=!pea.fav;

      render();

    };


    const lockBtn=
      document.createElement("button");

    lockBtn.className="lock";

    lockBtn.textContent=
      pea.locked
      ? "🔓 잠금 해제"
      : "🔒 잠금";

    lockBtn.onclick=()=>{

      pea.locked=!pea.locked;

      if(pea.locked){

        selected=
          selected.filter(
            id=>id!==pea.id
          );

      }

      render();

    };


    card.appendChild(selectBtn);

    card.appendChild(favBtn);

    card.appendChild(lockBtn);

    el.appendChild(card);

  });

}


/* 부모 선택 */

function toggleSelect(id){

  const pea=
    peas.find(p=>p.id===id);

  if(!pea || pea.locked)
    return;


  /* 이미 선택 */
  if(selected.includes(id)){

    selected=
      selected.filter(x=>x!==id);

  }

  else{

    if(selected.length>=2){

      selected.shift();

    }

    selected.push(id);

    addLog(
      "🧬 "+
      pea.name+
      " 을(를) 부모로 선택했습니다."
    );

  }

  render();

}


/* 쿨타임 */

function getCooldown(){

  return Math.max(
    0,
    cooldownUntil-Date.now()
  );

}


function updateCooldown(){

  const el=
    document.getElementById("cooldown");

  const ms=getCooldown();

  el.textContent=
    ms>0
    ? (ms/1000).toFixed(2)+"초"
    : "가능";

  document.getElementById("breed").disabled=
    ms>0;

  if(ms>0){

    setTimeout(
      updateCooldown,
      10
    );

  }

}


/* 교배 */

function breedOnce(){

  if(getCooldown()>0)
    return false;


  if(selected.length!==2){

    addLog(
      "⚠️ 부모 2마리를 선택해주세요."
    );

    return false;

  }


  const parentA=
    peas.find(
      p=>p.id===selected[0]
    );

  const parentB=
    peas.find(
      p=>p.id===selected[1]
    );


  if(
    !parentA ||
    !parentB ||
    parentA.locked ||
    parentB.locked
  ){

    addLog(
      "⚠️ 잠긴 완두콩은 교배할 수 없습니다."
    );

    return false;

  }


  /* 자식 유전자 생성 */

  const genes=
    loci.map((_,i)=>{

      const alleleA=
        parentA.genes[i]
        [Math.floor(Math.random()*2)];

      const alleleB=
        parentB.genes[i]
        [Math.floor(Math.random()*2)];


      return [
        alleleA,
        alleleB
      ]
      .sort((a,b)=>{

        if(
          a===a.toUpperCase()
        )
          return -1;

        if(
          b===b.toUpperCase()
        )
          return 1;

        return 0;

      })
      .join("");

    });


  const pea=
    makePea(
      "🌱 교배 완두콩 #"+
      (peas.length-1),
      genes
    );


  peas.push(pea);

  total++;

  cooldownUntil=
    Date.now()+50;


  register(pea);


  const recessive=
    recessiveCount(genes);


  /* 최근 탄생 표시 */

  lastBorn=pea;

  renderBorn(pea);


  /* 희귀 이벤트 */

  if(recessive===7){

    perfect++;

    addLog(
      "🌟🌟🌟 전설 탄생! "+
      pea.name
    );

    showCelebrate(
      "🎉🌟 전설의 완두콩 탄생!",
      "7개 형질이 모두 완전 열성입니다!",
      pea,
      true
    );

  }

  else if(recessive===6){

    sixCount++;

    addLog(
      "🌟🌟 특별한 완두콩 탄생! "+
      pea.name
    );

    showCelebrate(
      "🎉 특별한 완두콩!",
      "7개 중 6개 형질이 열성입니다!",
      pea,
      false
    );

  }

  else{

    addLog(
      "🌱 새로운 완두콩 생성! "+
      "열성 형질 "+
      recessive+"/7"
    );

  }


  render();

  return true;

}


/* 최근 탄생 */

function renderBorn(pea){

  const box=
    document.getElementById("bornBox");

  box.classList.add("show");


  document.getElementById("bornName")
    .textContent=pea.name;


  const rare=
    rarity(pea.genes);

  const rareBox=
    document.getElementById("bornRarity");

  rareBox.className=
    "rarity "+rare.cls;

  rareBox.textContent=
    rare.text;


  const genotype=
    document.getElementById(
      "bornGenotype"
    );

  genotype.innerHTML="";


  pea.genes.forEach(g=>{

    const span=
      document.createElement("span");

    span.className="gene";

    const isRec=
      g[0]===g[1] &&
      g[0]===g[0].toLowerCase();

    if(isRec)
      span.classList.add("recessive");

    span.textContent=
      isRec ? "◆ "+g : g;

    genotype.appendChild(span);

  });


  const count=
    recessiveCount(pea.genes);


  document.getElementById("bornInfo")
    .innerHTML=
      "🧬 <b>열성 형질:</b> "+
      count+"/7";


  const traits=
    document.getElementById(
      "bornTraits"
    );

  traits.innerHTML=
    "<b>🌿 형질</b><br><br>";


  phenotype(pea.genes).forEach((x,i)=>{

    const isRec=
      pea.genes[i][0]===
      pea.genes[i][1] &&
      pea.genes[i][0]===
      pea.genes[i][0].toLowerCase();

    traits.innerHTML+=
      loci[i].key+
      ": "+
      (isRec
        ? "<span class='recessive-label'>"+
          x+
          "</span>"
        : x)+
      "<br>";

  });

}


/* 축하창 */

function showCelebrate(
  title,
  text,
  pea,
  fireworks
){

  document.getElementById(
    "celebrateTitle"
  ).textContent=title;


  document.getElementById(
    "celebrateText"
  ).textContent=text;


  const box=
    document.getElementById(
      "celebrateGenes"
    );

  box.innerHTML=
    "<b>🧬 "+pea.genes.join(" ")+"</b>";


  document
    .getElementById("celebrate")
    .classList.add("show");


  if(fireworks){

    startFireworks();

  }

}


/* 축하창 닫기 */

function closeCelebrate(){

  document
    .getElementById("celebrate")
    .classList.remove("show");

  stopFireworks();

}


/* 자동 교배 */

function toggleAuto(){

  auto=!auto;

  const button=
    document.getElementById("auto");


  button.textContent=
    auto
    ? "⏹️ 자동 교배 중"
    : "▶️ 자동 교배";


  if(auto)
    autoLoop();

}


function autoLoop(){

  if(!auto)
    return;

  breedOnce();

  setTimeout(
    autoLoop,
    100
  );

}


/* ========================= */
/* 폭죽 시스템 */
/* ========================= */

const canvas=
  document.getElementById(
    "fireworks"
  );

const ctx=
  canvas.getContext("2d");

let fireworksRunning=false;

let particles=[];


function resizeCanvas(){

  canvas.width=
    window.innerWidth;

  canvas.height=
    window.innerHeight;

}


window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();


function createFirework(){

  const x=
    Math.random()*
    canvas.width;

  const y=
    Math.random()*
    canvas.height*
    .55+
    canvas.height*.12;


  for(let i=0;i<55;i++){

    const angle=
      Math.random()*
      Math.PI*2;

    const speed=
      Math.random()*5+2;


    particles.push({

      x:x,

      y:y,

      vx:Math.cos(angle)*speed,

      vy:Math.sin(angle)*speed,

      life:80+Math.random()*35,

      maxLife:115,

      size:Math.random()*3+1

    });

  }

}


function drawFireworks(){

  if(!fireworksRunning)
    return;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if(Math.random()<.08){

    createFirework();

  }


  particles=
    particles.filter(p=>{

      p.x+=p.vx;

      p.y+=p.vy;

      p.vy+=.045;

      p.vx*=.99;

      p.life--;


      const alpha=
        Math.max(
          0,
          p.life/p.maxLife
        );


      ctx.globalAlpha=alpha;

      ctx.fillStyle=
        "hsl("+
        Math.random()*360+
        ",100%,65%)";


      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI*2
      );

      ctx.fill();


      return p.life>0;

    });


  ctx.globalAlpha=1;

  requestAnimationFrame(
    drawFireworks
  );

}


function startFireworks(){

  fireworksRunning=true;

  particles=[];

  for(let i=0;i<4;i++){

    setTimeout(
      createFirework,
      i*250
    );

  }

  drawFireworks();

}


function stopFireworks(){

  fireworksRunning=false;

  particles=[];

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

}


/* 초기화 */

document.getElementById(
  "breed"
).onclick=breedOnce;


document.getElementById(
  "auto"
).onclick=toggleAuto;


document.getElementById(
  "reset"
).onclick=()=>{

  if(
    confirm(
      "정말 게임을 초기화할까요?"
    )
  ){

    location.reload();

  }

};

addLog(
  "🎮 게임 시작! 시작 완두콩 2마리가 준비되었습니다."
);

render();
